<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Privacy Policy – Drdemic</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'DM Sans',sans-serif;background:#F0F4F8;color:#0D1B2A;font-size:15px;line-height:1.7}
body{min-height:100vh;padding:40px 16px 80px}
.wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;padding:clamp(24px,5vw,48px);box-shadow:0 8px 40px rgba(21,101,192,.13)}
h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:#0A1628;margin-bottom:6px}
.updated{font-size:.82rem;color:#546E7A;margin-bottom:28px}
h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:#1565C0;margin:28px 0 10px}
p,li{color:#37474F;margin-bottom:12px}
ul{padding-left:20px;margin-bottom:12px}
.back{display:inline-block;margin-bottom:24px;color:#1565C0;font-weight:600;text-decoration:none;font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <a href="javascript:history.back()" class="back">← Back</a>
  <h1>Privacy Policy</h1>
  <div class="updated">Last updated: [DATE]</div>

  <!-- ═══ PASTE YOUR PRIVACY POLICY TEXT BELOW THIS LINE ═══ -->

  <p>[Your privacy policy content goes here.]</p>

  <!-- ═══ PASTE YOUR PRIVACY POLICY TEXT ABOVE THIS LINE ═══ -->

</div>
</body>
</html>
