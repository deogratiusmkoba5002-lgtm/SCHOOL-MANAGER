[pytest]
testpaths = tests
addopts = -ra --durations=10 --strict-markers --tb=short
xfail_strict = false
markers =
    e2e: full end-to-end workflow (slower); skip with -m "not e2e"
    foundation: test environment + factories sanity
    monitoring: error capture, grouping, alerting, dashboard, health, slow requests
    workflows: core school workflows (registration to payments)
    security: multi-tenant isolation + role restrictions