<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>School Manager – First Time Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0A1628,#1565C0);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:white;border-radius:16px;padding:40px;width:min(420px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{font-size:1.4rem;font-weight:800;color:#0A1628;margin-bottom:6px}
p{font-size:.85rem;color:#546E7A;margin-bottom:24px}
label{display:block;font-size:.75rem;font-weight:700;color:#546E7A;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
input{width:100%;padding:11px 14px;border:1.5px solid #B0BEC5;border-radius:9px;font-size:.9rem;margin-bottom:16px;outline:none}
input:focus{border-color:#1565C0;box-shadow:0 0 0 3px rgba(21,101,192,.1)}
button{width:100%;padding:13px;background:linear-gradient(135deg,#1565C0,#1976D2);color:white;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
.msg{margin-top:16px;padding:12px;border-radius:8px;font-size:.85rem;display:none}
.msg.success{background:#E8F5E9;color:#2E7D32;border-left:3px solid #00C853}
.msg.error{background:#FFEBEE;color:#C62828;border-left:3px solid #F44336}
.warning{background:#FFF8E1;border-left:3px solid #FFD600;padding:12px;border-radius:8px;font-size:.82rem;color:#5D4037;margin-bottom:20px}
</style>
</head>
<body>
<div class="card">
  <h1>🎓 First Time Setup</h1>
  <p>Create the admin account for School Manager. This only works once.</p>
  <div class="warning">⚠ You must set <strong>ADMIN_SETUP_SECRET</strong> in Railway environment variables before using this page.</div>
  <label>Setup Secret (from Railway Variables)</label>
  <input type="password" id="secret" placeholder="Your ADMIN_SETUP_SECRET value"/>
  <label>Admin Username</label>
  <input type="text" id="username" placeholder="e.g. admin"/>
  <label>Admin Password</label>
  <input type="password" id="password" placeholder="Choose a strong password"/>
  <button onclick="doSetup()">Create Admin Account</button>
  <div class="msg" id="msg"></div>
</div>
<script>
async function doSetup(){
  const secret   = document.getElementById("secret").value.trim();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const msg      = document.getElementById("msg");
  msg.style.display="none";
  if(!secret||!username||!password){
    msg.textContent="Fill in all fields.";
    msg.className="msg error"; msg.style.display="block"; return;
  }
  if(password.length < 4){
    msg.textContent="Password must be at least 4 characters.";
    msg.className="msg error"; msg.style.display="block"; return;
  }
  try{
    const r = await fetch("/api/setup_admin",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({secret,username,password})
    });
    const d = await r.json();
    if(d.ok){
      msg.textContent="✓ Admin account created! Your school's registration code is \"school-1\" — you'll need it (along with your username & password) to log in. You can change it later from Config. Go to the main page and log in.";
      msg.className="msg success"; msg.style.display="block";
    } else {
      msg.textContent=d.error||"Failed.";
      msg.className="msg error"; msg.style.display="block";
    }
  } catch(e){
    msg.textContent="Could not connect to server.";
    msg.className="msg error"; msg.style.display="block";
  }
}
</script>
</body>
</html>
